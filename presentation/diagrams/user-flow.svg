ges a question (or pastes a URL: intent=summarize_url skips recall, reads that article's chunks directly)</text><rect x="20" y="172" width="130" height="86" rx="6" fill="#0f172a"/><rect x="20" y="172" width="130" height="86" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="85.0" y="206.0" fill="white" font-size="13" font-weight="600" text-anchor="middle">Question</text><text x="85.0" y="222.0" fill="#94a3b8" font-size="10.5" text-anchor="middle">Telegram · POST /qa</text><text x="85.0" y="235.0" fill="#94a3b8" font-size="10.5" text-anchor="middle">one or many asks</text><rect x="168" y="172" width="130" height="86" rx="6" fill="#0f172a"/><rect x="168" y="172" width="130" height="86" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="233.0" y="199.5" fill="white" font-size="13" font-weight="600" text-anchor="middle">Analyse</text><text x="233.0" y="215.5" fill="#94a3b8" font-size="10.5" text-anchor="middle">lfm2.5-thinking</text><text x="233.0" y="228.5" fill="#94a3b8" font-size="10.5" text-anchor="middle">1.2b: intent, query,</text><text x="233.0" y="241.5" fill="#94a3b8" font-size="10.5" text-anchor="middle">keywords + HyDE</text><rect x="316" y="172" width="130" height="86" rx="6" fill="#0f172a"/><rect x="316" y="172" width="130" height="86" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="381.0" y="199.5" fill="white" font-size="13" font-weight="600" text-anchor="middle">Hybrid recall</text><text x="381.0" y="215.5" fill="#94a3b8" font-size="10.5" text-anchor="middle">pgvector cosine ×2</text><text x="381.0" y="228.5" fill="#94a3b8" font-size="10.5" text-anchor="middle">(query + HyDE)</text><text x="381.0" y="241.5" fill="#94a3b8" font-size="10.5" text-anchor="middle">+ BM25 ts_rank_cd</text><rect x="464" y="172" width="130" height="86" rx="6" fill="#0f172a"/><rect x="464" y="172" width="130" height="86" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/><