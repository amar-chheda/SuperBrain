ed_*_total</text><rect x="20" y="530" width="1164" height="66" rx="6" fill="#0f172a"/><rect x="20" y="530" width="1164" height="66" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="602.0" y="560.5" fill="white" font-size="13" font-weight="600" text-anchor="middle">Grafana :3000 — provisioned dashboard, plain SQL over the same Postgres</text><text x="602.0" y="576.5" fill="#94a3b8" font-size="10.5" text-anchor="middle">ingestion status · LLM latency + failures · QA abort rate · LLM call inspector (prompt/response) · retrieval trace (vector vs BM25 hits)</text><text x="484" y="514" fill="#a78bfa" font-size="9.5" text-anchor="middle" font-weight="400">SQL panels read these tables</text><rect x="20" y="630" width="16" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/><text x="42" y="639" fill="#94a3b8" font-size="10.5">Client / output</text><rect x="167.0" y="630" width="16" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399"/><text x="189.0" y="639" fill="#94a3b8" font-size="10.5">Backend step</text><rect x="294.2" y="630" width="16" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/><text x="316.2" y="639" fill="#94a3b8" font-size="10.5">Local model / tokenizer</text><rect x="494.0" y="630" width="16" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/><text x="516.0" y="639" fill="#94a3b8" font-size="10.5">Postgres</text><rect x="594.8" y="630" width="16" height="10" rx="2" fill="rgba(251,146,60,0.3)" stroke="#fb923c"/><text x="616.8" y="639" fill="#94a3b8" font-size="10.5">LLM gateway</text><rect x="715.4" y="630" width="16" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/><text x="737.4" y="639" fill="#94a3b8" font-size="10.5">Gate / observability</text></svg>